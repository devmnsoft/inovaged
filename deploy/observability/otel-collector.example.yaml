receivers:
  otlp:
    protocols:
      grpc: {endpoint: 127.0.0.1:4317}
      http: {endpoint: 127.0.0.1:4318}
processors:
  memory_limiter: {check_interval: 1s, limit_mib: 256, spike_limit_mib: 64}
  attributes/privacy:
    actions:
      - {key: http.request.header.authorization, action: delete}
      - {key: http.request.header.cookie, action: delete}
  resource:
    attributes:
      - {key: telemetry.collector.profile, value: inovaged-example, action: upsert}
  batch: {timeout: 5s, send_batch_size: 512, send_batch_max_size: 1024}
exporters:
  debug: {verbosity: basic}
service:
  pipelines:
    traces: {receivers: [otlp], processors: [memory_limiter, attributes/privacy, resource, batch], exporters: [debug]}
    metrics: {receivers: [otlp], processors: [memory_limiter, attributes/privacy, resource, batch], exporters: [debug]}
    logs: {receivers: [otlp], processors: [memory_limiter, attributes/privacy, resource, batch], exporters: [debug]}
