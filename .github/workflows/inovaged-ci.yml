name: inovaged-ci
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [ main, develop, "feature/**", "codex/**" ]

permissions:
  contents: read
  actions: read
  checks: read

concurrency:
  group: inovaged-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Lint every workflow
        uses: raven-actions/actionlint@v2

  solution-validation:
    needs: actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Show SDK information
        run: dotnet --info
      - name: Validate solution projects
        run: dotnet sln InovaGed.sln list
      - name: Restore solution
        run: dotnet restore InovaGed.sln --verbosity normal > restore.log 2>&1
      - name: Build solution
        run: dotnet build InovaGed.sln --no-restore --configuration Release --verbosity normal > build.log 2>&1
      - name: Run infrastructure-free tests
        run: dotnet test InovaGed.sln --no-build --configuration Release --filter "Category!=Integration&Category!=EndToEnd&Category!=Windows" --logger "trx;LogFileName=all-tests.trx" --results-directory TestResults
      - name: Reject empty or failed test runs
        run: python3 scripts/ci/assert-trx-has-tests.py 'TestResults/**/*.trx'
      - name: Check patch whitespace
        run: git diff --check
      - name: Upload solution diagnostics
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: solution-and-build-test-results
          path: |
            restore.log
            build.log
            TestResults/**/*.trx

  server-linux:
    needs: solution-validation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: inovaged_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U postgres -d inovaged_ci"
          --health-interval=10s --health-timeout=5s --health-retries=10
    env:
      ConnectionStrings__DefaultConnection: Host=localhost;Port=5432;Database=inovaged_ci;Username=postgres;Password=postgres
      Storage__Local__RootPath: ${{ github.workspace }}/.ci-storage
      Preview__LibreOfficePath: /usr/bin/libreoffice
      Ocr__Enabled: 'false'
      DigitalSignature__Enabled: 'true'
      DigitalSignature__Mode: AgentCms
      DigitalSignature__CertificateIdentityHmacKey: ci-only-not-for-production
      DigitalSignature__CertificateIdentityHmacKeyVersion: ci-v1
      DigitalSignature__PublicServerBaseUrl: http://localhost:5080
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4
        with: { dotnet-version: '8.0.x' }
      - name: Restore solution
        run: dotnet restore InovaGed.sln
      - name: Build server hosts
        run: dotnet build InovaGed.Web/InovaGed.Web.csproj --no-restore --configuration Release && dotnet build WebGed.WebApi/WebGed.WebApi.csproj --no-restore --configuration Release
      - name: Run server integration tests
        run: dotnet test InovaGed.Application.Tests/InovaGed.Application.Tests.csproj --configuration Release --filter "FullyQualifiedName~DependencyInjection|FullyQualifiedName~Antiforgery" --logger "trx;LogFileName=server-linux.trx" --results-directory TestResults
      - name: Reject empty or failed server test run
        run: python3 scripts/ci/assert-trx-has-tests.py TestResults/server-linux.trx

  agent-windows:
    needs: solution-validation
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4
        with: { dotnet-version: '8.0.x' }
      - name: Restore Signing Agent
        run: dotnet restore InovaGed.Signing.Agent/InovaGed.Signing.Agent.csproj
      - name: Build Signing Agent
        run: dotnet build InovaGed.Signing.Agent/InovaGed.Signing.Agent.csproj --no-restore --configuration Release
      - name: Test Signing Agent
        run: dotnet test InovaGed.Signing.Agent.Tests/InovaGed.Signing.Agent.Tests.csproj --configuration Release --logger "trx;LogFileName=agent-windows.trx" --results-directory TestResults
      - name: Reject empty or failed agent test run
        run: python scripts/ci/assert-trx-has-tests.py TestResults/agent-windows.trx
      - name: Run Signing Agent doctor
        run: dotnet run --project InovaGed.Signing.Agent/InovaGed.Signing.Agent.csproj -- doctor

  security-guards:
    needs: solution-validation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Enforce static security guards
        run: |
          set -euo pipefail
          ! rg -n "AllowAnyOrigin" --glob '!**/bin/**' --glob '!**/obj/**' .
          ! rg -n "AllowAllPermissionChecker|CertificateValidationStub" InovaGed.Web InovaGed.Infrastructure WebGed.WebApi --glob '!**/bin/**' --glob '!**/obj/**'
          ! rg -n "EnsureMandatoryChecks|Check registrado para homologação" InovaGed.Infrastructure/Signatures --glob '!**/bin/**' --glob '!**/obj/**'
          ! rg -n "return Task.FromResult\(.*VALID|SignatureValidationResult\(\"VALID\"" InovaGed.Web InovaGed.Infrastructure --glob '!**/bin/**' --glob '!**/obj/**'

  cms-e2e:
    needs: migration-matrix
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4
        with: { dotnet-version: '8.0.x' }
      - name: Run CMS end-to-end tests
        run: dotnet test InovaGed.Signing.EndToEndTests/InovaGed.Signing.EndToEndTests.csproj --configuration Release --logger "trx;LogFileName=cms-e2e.trx" --results-directory TestResults
      - name: Reject empty or failed CMS test run
        run: python3 scripts/ci/assert-trx-has-tests.py TestResults/cms-e2e.trx
      - name: Record OpenSSL version
        run: openssl version | tee TestResults/openssl.txt

  poc-contract-tests:
    needs: cms-e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4
        with: { dotnet-version: '8.0.x' }
      - name: Validate PoC matrix JSON
        run: python3 -m json.tool docs/poc/matriz-poc-1-27.json >/dev/null
      - name: Run PoC contract suites
        shell: bash
        run: |
          set -euo pipefail
          for suite in PocPhase1InstrumentsTests PocPhase2RetentionTests PocPhase3SecurityTests PocPhase4SigningTests PocPhase5PhysicalArchiveTests PocPhase6LoansTests PocPhase7AuditTests PocMatrixValidationTests; do
            dotnet test InovaGed.Application.Tests/InovaGed.Application.Tests.csproj --configuration Release --filter "FullyQualifiedName~${suite}" --logger "trx;LogFileName=${suite}.trx" --results-directory TestResults
          done
      - name: Reject empty or failed PoC test run
        run: python3 scripts/ci/assert-trx-has-tests.py 'TestResults/Poc*.trx'

  migration-matrix:
    needs: [server-linux, agent-windows, security-guards]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres, POSTGRES_DB: inovaged_migrations }
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U postgres -d inovaged_migrations"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Validate migration orchestrator exists
        run: test -f database/apply_all_required_migrations.sql
      - name: Apply required migrations
        run: psql "postgresql://postgres:postgres@localhost:5432/inovaged_migrations" -v ON_ERROR_STOP=1 -f database/apply_all_required_migrations.sql | tee migration-first.log
      - name: Prove migration idempotency
        run: psql "postgresql://postgres:postgres@localhost:5432/inovaged_migrations" -v ON_ERROR_STOP=1 -f database/apply_all_required_migrations.sql | tee migration-second.log

  release-gate:
    if: always()
    needs:
      - actionlint
      - solution-validation
      - server-linux
      - agent-windows
      - security-guards
      - migration-matrix
      - cms-e2e
      - poc-contract-tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Require every mandatory gate to pass
        env:
          NEEDS_CONTEXT: ${{ toJson(needs) }}
        run: |
          python - <<'PY'
          import json, os, sys
          results = {name: job["result"] for name, job in json.loads(os.environ["NEEDS_CONTEXT"]).items()}
          failed = {name: result for name, result in results.items() if result != "success"}
          print(json.dumps(results, indent=2, sort_keys=True))
          sys.exit(1 if failed else 0)
          PY
