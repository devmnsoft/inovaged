name: inovaged-ci
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [ main, develop, "feature/**", "codex/**" ]

permissions:
  contents: read
  actions: read
  checks: read

concurrency:
  group: inovaged-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  toolchain-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '8.0.x' }
      - name: Verify .NET toolchain and repository contracts
        shell: bash
        run: |
          bash eng/verify-dotnet-sdk.sh
          dotnet --version
          dotnet --list-sdks
          python3 - <<'PY'
          import json, pathlib, sys, xml.etree.ElementTree as ET
          root=pathlib.Path('.')
          sdk=json.loads((root/'global.json').read_text())['sdk']
          assert sdk == {'version':'8.0.100','rollForward':'latestFeature','allowPrerelease':False}
          projects=list(root.glob('**/*.csproj'))
          assert projects and all((ET.parse(p).findtext('.//TargetFramework') == 'net8.0') for p in projects)
          assert ET.parse('Directory.Build.props').findtext('.//LangVersion') == '12.0'
          assert ET.parse('Directory.Packages.props').findtext('.//ManagePackageVersionsCentrally') == 'true'
          PY
      - name: Create safe toolchain diagnostics
        if: always()
        run: bash eng/dotnet-diagnostics.sh
      - name: Publish toolchain diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with: { name: toolchain-diagnostics, path: artifacts/diagnostics/ }

  linux-build-validation:
    needs: toolchain-validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '8.0.x' }
      - run: bash eng/build.sh

  windows-build-validation:
    needs: toolchain-validation
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '8.0.x' }
      - name: Validate PowerShell build and Windows paths
        shell: pwsh
        run: |
          .\eng\verify-dotnet-sdk.ps1
          .\eng\build.ps1

  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: false
      - name: Install pinned actionlint
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Lint workflow
        shell: bash
        run: |
          shopt -s nullglob
          workflows=(.github/workflows/*.yml .github/workflows/*.yaml)
          ((${#workflows[@]} > 0))
          actionlint -verbose "${workflows[@]}"

  solution-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Show SDK information
        run: |
          dotnet --info
          dotnet --version | grep -E '^8\.0\.'
      - name: Validate solution projects
        run: dotnet sln InovaGed.sln list
      - name: Restore solution
        shell: bash
        run: |
          set -o pipefail
          dotnet restore InovaGed.sln --verbosity normal 2>&1 | tee restore.log
      - name: Build solution
        shell: bash
        run: |
          set -o pipefail
          dotnet build InovaGed.sln --no-restore --configuration Release --verbosity normal 2>&1 | tee build.log
      - name: Run infrastructure-free tests
        run: dotnet test InovaGed.sln --no-build --configuration Release --filter "Category=Unit|Category=Architecture|Category=CmsContract|Category=PoCContract" --logger "trx;LogFileName=all-tests.trx" --results-directory TestResults
      - name: Reject empty or failed test runs
        run: python3 scripts/ci/assert-trx-has-tests.py 'TestResults/**/*.trx'
      - name: Check patch whitespace
        run: git diff --check
      - name: Upload solution diagnostics
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: solution-and-build-test-results
          path: |
            restore.log
            build.log
            TestResults/**/*.trx

  razor-view-compilation:
    needs: solution-validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '8.0.x' }
      - run: dotnet restore InovaGed.Web/InovaGed.Web.csproj
      - run: dotnet build InovaGed.Web/InovaGed.Web.csproj --no-restore --configuration Debug
      - run: dotnet build InovaGed.Web/InovaGed.Web.csproj --no-restore --configuration Release
      - run: dotnet publish InovaGed.Web/InovaGed.Web.csproj --no-build --configuration Release --output publish/web

  migration-manifest-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '8.0.x' }
      - run: python3 -m json.tool database/migrations.manifest.json >/dev/null
      - run: dotnet test InovaGed.Application.Tests/InovaGed.Application.Tests.csproj --configuration Release --filter "FullyQualifiedName~MigrationManifestTests"

  server-linux:
    needs: solution-validation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: inovaged_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U postgres -d inovaged_ci"
          --health-interval=10s --health-timeout=5s --health-retries=10
    env:
      ConnectionStrings__DefaultConnection: Host=localhost;Port=5432;Database=inovaged_ci;Username=postgres;Password=postgres
      Storage__Local__RootPath: ${{ github.workspace }}/.ci-storage
      Preview__LibreOfficePath: /usr/bin/libreoffice
      Ocr__Enabled: 'false'
      DigitalSignature__Enabled: 'false'
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4
        with: { dotnet-version: '8.0.x' }
      - name: Generate CI signature secrets
        shell: bash
        run: |
          hmac_key=$(openssl rand -hex 32)
          echo "::add-mask::$hmac_key"
          {
            echo "DigitalSignature__CertificateIdentityHmacKey=$hmac_key"
            echo "DigitalSignature__CertificateIdentityHmacKeyVersion=ci-v1"
          } >> "$GITHUB_ENV"
      - name: Restore solution
        run: dotnet restore InovaGed.sln
      - name: Build server hosts
        run: dotnet build InovaGed.Web/InovaGed.Web.csproj --no-restore --configuration Release && dotnet build WebGed.WebApi/WebGed.WebApi.csproj --no-restore --configuration Release
      - name: Apply server migrations
        run: psql "postgresql://postgres:postgres@localhost:5432/inovaged_ci" -v ON_ERROR_STOP=1 -f database/apply_all_required_migrations.sql
      - name: Start server hosts and verify health
        shell: bash
        run: bash scripts/ci/verify-server-startup.sh
      - name: Run server integration tests
        run: dotnet test InovaGed.Application.Tests/InovaGed.Application.Tests.csproj --configuration Release --filter "FullyQualifiedName~DependencyInjection|FullyQualifiedName~Antiforgery" --logger "trx;LogFileName=server-linux.trx" --results-directory TestResults
      - name: Reject empty or failed server test run
        run: python3 scripts/ci/assert-trx-has-tests.py TestResults/server-linux.trx
      - name: Stop server hosts
        if: always()
        shell: bash
        run: bash scripts/ci/stop-server-hosts.sh
      - name: Upload server diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: server-linux-logs
          path: .ci-logs/*.log

  agent-windows:
    needs: solution-validation
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4
        with: { dotnet-version: '8.0.x' }
      - name: Restore Signing Agent
        run: dotnet restore InovaGed.Signing.Agent/InovaGed.Signing.Agent.csproj
      - name: Build Signing Agent
        run: dotnet build InovaGed.Signing.Agent/InovaGed.Signing.Agent.csproj --no-restore --configuration Release
      - name: Test Signing Agent
        run: dotnet test InovaGed.Signing.Agent.Tests/InovaGed.Signing.Agent.Tests.csproj --configuration Release --logger "trx;LogFileName=agent-windows.trx" --results-directory TestResults
      - name: Reject empty or failed agent test run
        run: python scripts/ci/assert-trx-has-tests.py TestResults/agent-windows.trx
      - name: Exercise Signing Agent lifecycle
        shell: pwsh
        run: |
          $agent = "InovaGed.Signing.Agent/InovaGed.Signing.Agent.csproj"
          $data = Join-Path $env:RUNNER_TEMP "signing-agent-lifecycle"
          dotnet run --project $agent -- version
          dotnet run --project $agent -- doctor --data-dir $data
          dotnet run --project $agent -- install --data-dir $data
          dotnet run --project $agent -- rotate-certificate --data-dir $data
          dotnet run --project $agent -- uninstall --data-dir $data
      - name: Publish Signing Agent win-x64
        run: dotnet publish InovaGed.Signing.Agent/InovaGed.Signing.Agent.csproj --configuration Release --runtime win-x64 --self-contained false --output publish/signing-agent-win-x64
      - name: Verify Signing Agent executable
        shell: pwsh
        run: |
          if (-not (Test-Path publish/signing-agent-win-x64/InovaGed.Signing.Agent.exe)) { throw "Signing Agent executable was not published" }
      - name: Upload Signing Agent package
        uses: actions/upload-artifact@v4
        with:
          name: signing-agent-win-x64
          path: publish/signing-agent-win-x64/**

  security-guards:
    needs: solution-validation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Enforce static security guards
        run: |
          set -euo pipefail
          if git grep -nEi '(Password|Pwd)=[^;"[:space:]]+' -- ':(glob)**/appsettings*.json' ':(glob)**/*.config' | rg -v 'Password=(SUA_SENHA|YOUR_PASSWORD|\$\{|%|<)'; then
            echo "Connection string with a populated password found in tracked configuration." >&2
            exit 1
          fi
          ! rg -n "AllowAnyOrigin" InovaGed.Web InovaGed.Infrastructure WebGed.WebApi InovaGed.Signing.Agent --glob '!**/bin/**' --glob '!**/obj/**' .
          ! rg -n "AllowAllPermissionChecker|CertificateValidationStub" InovaGed.Web InovaGed.Infrastructure WebGed.WebApi --glob '!**/bin/**' --glob '!**/obj/**'
          ! rg -n "EnsureMandatoryChecks|Check registrado para homologação" InovaGed.Infrastructure/Signatures --glob '!**/bin/**' --glob '!**/obj/**'
          ! rg -n "return Task.FromResult\(.*VALID|SignatureValidationResult\(\"VALID\"" InovaGed.Web InovaGed.Infrastructure --glob '!**/bin/**' --glob '!**/obj/**'
          ! rg -n "SearchFoldersAsync\([^\n]*CurrentTenantId\(|MoveAsync\([^\n]*CurrentTenantId\(|MoveBulkAsync\([^\n]*CurrentTenantId\(" --glob '*.cs'
          if rg -n "new Regex\(|Regex\." InovaGed.Web InovaGed.Application InovaGed.Infrastructure --glob '*.cs' | rg -v "RegexOptions\.NonBacktracking|// REGEX_JUSTIFIED|System.Text.RegularExpressions"; then
            echo "Regex crítico sem RegexOptions.NonBacktracking ou justificativa REGEX_JUSTIFIED." >&2
            exit 1
          fi
          ! rg -n "BEGIN (RSA|OPENSSH|DSA|EC) PRIVATE KEY|PRIVATE KEY-----" InovaGed.Web InovaGed.Infrastructure WebGed.WebApi InovaGed.Signing.Agent --glob '!**/bin/**' --glob '!**/obj/**' .

  cms-contract-tests:
    needs: migration-idempotency
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: inovaged_cms_contract
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U postgres -d inovaged_cms_contract"
          --health-interval=10s --health-timeout=5s --health-retries=10
    env:
      ConnectionStrings__DefaultConnection: Host=localhost;Port=5432;Database=inovaged_cms_contract;Username=postgres;Password=postgres
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4
        with: { dotnet-version: '8.0.x' }
      - name: Run CMS contract tests
        run: dotnet test InovaGed.Application.Tests/InovaGed.Application.Tests.csproj --configuration Release --filter "Category=CmsContract" --logger "trx;LogFileName=cms-contract.trx" --results-directory TestResults
      - name: Reject empty or failed CMS test run
        run: python3 scripts/ci/assert-trx-has-tests.py TestResults/cms-contract.trx

  poc-matrix-contract-tests:
    needs: cms-contract-tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4
        with: { dotnet-version: '8.0.x' }
      - name: Validate PoC matrix JSON
        run: python3 -m json.tool docs/poc/matriz-poc-1-27.json >/dev/null
      - name: Run PoC contract suites
        shell: bash
        run: |
          set -euo pipefail
          for suite in PocPhase1InstrumentsTests PocPhase2RetentionTests PocPhase3SecurityTests PocPhase4SigningTests PocPhase5PhysicalArchiveTests PocPhase6LoansTests PocPhase7AuditTests PocMatrixValidationTests; do
            dotnet test InovaGed.Application.Tests/InovaGed.Application.Tests.csproj --configuration Release --filter "FullyQualifiedName~${suite}" --logger "trx;LogFileName=${suite}.trx" --results-directory TestResults
          done
      - name: Reject empty or failed PoC test run
        run: python3 scripts/ci/assert-trx-has-tests.py 'TestResults/Poc*.trx'

  migration-idempotency:
    needs: [server-linux, agent-windows, security-guards]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres, POSTGRES_DB: inovaged_migrations }
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U postgres -d inovaged_migrations"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Validate migration orchestrator exists
        run: test -f database/apply_all_required_migrations.sql
      - name: Apply required migrations
        shell: bash
        run: |
          set -euo pipefail
          for scenario in empty pre_cms; do
            database="inovaged_${scenario}"
            createdb "postgresql://postgres:postgres@localhost:5432/postgres" "$database"
            connection="postgresql://postgres:postgres@localhost:5432/$database"
            if [[ "$scenario" == pre_cms ]]; then
              psql "$connection" -f database/fixtures/pre-cms-base.sql
            fi
            psql "$connection" -v ON_ERROR_STOP=1 -f database/apply_all_required_migrations.sql | tee "migration-${scenario}-first.log"
            psql "$connection" -v ON_ERROR_STOP=1 -f database/apply_all_required_migrations.sql | tee "migration-${scenario}-second.log"
            psql "$connection" -f database/assert_migration_state.sql
            if [[ "$scenario" == pre_cms ]]; then
              test "$(psql "$connection" -Atc "select count(*) from ged.folder where id='00000000-0000-0000-0000-000000000101'")" = 1
            fi
          done

  continuity-integration:
    needs: [actionlint, solution-validation]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres, POSTGRES_DB: inovaged_continuity }
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U postgres -d inovaged_continuity"
          --health-interval=10s --health-timeout=5s --health-retries=10
    env:
      ConnectionStrings__DefaultConnection: Host=localhost;Port=5432;Database=inovaged_continuity;Username=postgres;Password=postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '8.0.x' }
      - name: Apply continuity migrations
        run: psql "postgresql://postgres:postgres@localhost:5432/inovaged_continuity" -v ON_ERROR_STOP=1 -f database/apply_all_required_migrations.sql > continuity-migrations.log
      - name: Assert continuity schema
        run: psql "postgresql://postgres:postgres@localhost:5432/inovaged_continuity" -v ON_ERROR_STOP=1 -f database/assert_continuity_schema.sql
      - name: Run continuity tests
        run: dotnet test InovaGed.Application.Tests/InovaGed.Application.Tests.csproj --configuration Release --filter "FullyQualifiedName~Continuity" --logger "trx;LogFileName=continuity.trx" --results-directory TestResults > continuity-tests.log
      - name: Reject empty or failed continuity run
        run: python3 scripts/ci/assert-trx-has-tests.py TestResults/continuity.trx
      - name: Publish continuity evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: continuity-integration-evidence
          path: |
            TestResults/continuity.trx
            continuity-migrations.log
            continuity-tests.log

  identity-auth-integration:
    needs: [actionlint, solution-validation]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres, POSTGRES_DB: inovaged_identity }
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U postgres -d inovaged_identity"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '8.0.x' }
      - name: Exercise legacy identity schema and idempotent hardening
        shell: bash
        run: |
          set -euo pipefail
          connection="postgresql://postgres:postgres@localhost:5432/inovaged_identity"
          psql "$connection" -v ON_ERROR_STOP=1 -f database/fixtures/legacy-identity-role-schema.sql
          psql "$connection" -v ON_ERROR_STOP=1 -f database/migrations/2026_07_identity_role_integrity.sql
          psql "$connection" -v ON_ERROR_STOP=1 -f database/migrations/2026_07_identity_role_integrity.sql
          psql "$connection" -v ON_ERROR_STOP=1 -f database/assert_identity_role_state.sql
      - name: Run identity authentication contracts
        run: dotnet test InovaGed.Application.Tests/InovaGed.Application.Tests.csproj --configuration Release --filter "Category=IdentityAuthIntegration" --logger "trx;LogFileName=identity-auth-integration.trx" --results-directory TestResults
      - name: Reject empty or failed identity test run
        run: python3 scripts/ci/assert-trx-has-tests.py TestResults/identity-auth-integration.trx
      - name: Publish identity authentication evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: identity-auth-integration-results
          path: TestResults/identity-auth-integration.trx

  release-package-build:
    needs: solution-validation
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '8.0.x' }
      - name: Build deployment tool
        run: dotnet publish InovaGed.Deployment.Tool/InovaGed.Deployment.Tool.csproj -c Release -r win-x64 --self-contained false -o artifacts/deployment-tool
      - uses: actions/upload-artifact@v4
        with: { name: deployment-tool, path: artifacts/deployment-tool, retention-days: 14 }

  release-package-validation:
    needs: release-package-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '8.0.x' }
      - run: dotnet build InovaGed.Deployment.Tool/InovaGed.Deployment.Tool.csproj -c Release
      - run: python3 -m json.tool database/migrations.manifest.json >/dev/null

  release-package-security:
    needs: release-package-validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject deployable secrets and private key material
        shell: bash
        run: |
          ! rg -n -i 'BEGIN (RSA )?PRIVATE KEY|BEGIN CERTIFICATE|Bearer [A-Za-z0-9]' deploy eng/release docs/deployment
          ! find deploy -type f \( -iname '*.pfx' -o -iname '*.key' \) -print -quit | grep .

  iis-install-smoke:
    needs: release-package-validation
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Pester
        shell: pwsh
        run: Install-Module Pester -Force -Scope CurrentUser -MinimumVersion 5.5
      - name: Test isolated IIS installer contracts
        shell: pwsh
        run: Invoke-Pester deploy/tests/InovaGed.IisDeployment.Tests.ps1 -CI

  iis-update-smoke:
    needs: iis-install-smoke
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assert versioned update and cutover safeguards
        shell: pwsh
        run: |
          $text=Get-Content deploy/iis/Invoke-InovaGedDeployment.ps1 -Raw
          if($text -notmatch 'Expand-Archive' -or $text -notmatch 'Switch-InovaGedRelease'){throw 'Update contract missing'}

  iis-rollback-smoke:
    needs: iis-update-smoke
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assert rollback is binary-only
        shell: pwsh
        run: |
          $text=Get-Content deploy/iis/Invoke-InovaGedDeployment.ps1 -Raw
          if($text -match 'psql|DROP DATABASE'){throw 'Database rollback is forbidden'}

  deployment-documentation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: test "$(find docs/deployment -maxdepth 1 -type f | wc -l)" -ge 17

  deployment-gate:
    if: always()
    needs: [release-package-build, release-package-validation, release-package-security, iis-install-smoke, iis-update-smoke, iis-rollback-smoke, deployment-documentation]
    runs-on: ubuntu-latest
    steps:
      - env: { NEEDS_CONTEXT: '${{ toJson(needs) }}' }
        run: python -c 'import json,os,sys; r=json.loads(os.environ["NEEDS_CONTEXT"]); print(r); sys.exit(any(v["result"]!="success" for v in r.values()))'

  observability-contract-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '8.0.x' }
      - name: Run privacy, cardinality, SLO, alert and incident contracts
        run: dotnet test InovaGed.Application.Tests/InovaGed.Application.Tests.csproj --configuration Release --filter "FullyQualifiedName~Observability|FullyQualifiedName~TelemetrySanitizer|FullyQualifiedName~ErrorBudget|FullyQualifiedName~Cardinality|FullyQualifiedName~IncidentLifecycle|FullyQualifiedName~AlertDeduplication"
      - name: Validate offline Collector configuration
        shell: pwsh
        run: ./deploy/observability/validate-otel-collector.ps1

  observability-gate:
    if: always()
    needs: [observability-contract-tests]
    runs-on: ubuntu-latest
    steps:
      - env: { NEEDS_CONTEXT: '${{ toJson(needs) }}' }
        run: python -c 'import json,os,sys; r=json.loads(os.environ["NEEDS_CONTEXT"]); print(r); sys.exit(any(v["result"]!="success" for v in r.values()))'

  premium-ui-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '8.0.x' }
      - run: dotnet restore InovaGed.UiTests/InovaGed.UiTests.csproj
      - run: dotnet build InovaGed.UiTests/InovaGed.UiTests.csproj --no-restore --configuration Release

  premium-ui-browser-tests:
    needs: premium-ui-build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres, POSTGRES_DB: inovaged_ui }
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U postgres -d inovaged_ui"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://127.0.0.1:5080
      ConnectionStrings__DefaultConnection: Host=localhost;Port=5432;Database=inovaged_ui;Username=postgres;Password=postgres
      INOVAGED_UI_BASE_URL: http://127.0.0.1:5080
      INOVAGED_UI_PASSWORD: ${{ secrets.INOVAGED_UI_PASSWORD }}
      INOVAGED_DEV_SEED_PASSWORD: ${{ secrets.INOVAGED_UI_PASSWORD }}
      SystemSeed__Enabled: 'true'
      SystemSeed__FailFastOnSeedError: 'true'
      Ocr__Enabled: 'false'
      DigitalSignature__Enabled: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '8.0.x' }
      - name: Restore and build the real browser suite
        run: |
          test -n "$INOVAGED_UI_PASSWORD"
          echo "::add-mask::$INOVAGED_UI_PASSWORD"
          dotnet restore InovaGed.UiTests/InovaGed.UiTests.csproj
          dotnet build InovaGed.UiTests/InovaGed.UiTests.csproj --no-restore --configuration Release
      - name: Install Playwright Chromium
        run: pwsh InovaGed.UiTests/bin/Release/net8.0/playwright.ps1 install --with-deps chromium
      - name: Apply official migrations
        run: psql "postgresql://postgres:postgres@localhost:5432/inovaged_ui" -v ON_ERROR_STOP=1 -f database/apply_all_required_migrations.sql
      - name: Start InovaGED and await readiness
        shell: bash
        run: |
          dotnet run --project InovaGed.Web/InovaGed.Web.csproj --no-build --configuration Release >InovaGed.UiTests/Reports/web.log 2>&1 &
          echo $! > InovaGed.UiTests/Reports/web.pid
          for attempt in {1..60}; do curl --fail --silent http://127.0.0.1:5080/health/ready && exit 0; sleep 2; done
          cat InovaGed.UiTests/Reports/web.log
          exit 1
      - name: Execute Playwright interactions and screenshot comparisons
        run: dotnet test InovaGed.UiTests/InovaGed.UiTests.csproj --no-build --configuration Release --logger "trx;LogFileName=ui.trx" --results-directory TestResults
      - name: Reject empty or simulated UI execution
        run: python3 scripts/ci/assert-ui-tests-executed.py
      - name: Publish browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: premium-ui-browser-evidence
          if-no-files-found: error
          path: |
            InovaGed.UiTests/Screenshots/
            InovaGed.UiTests/Reports/
            TestResults/

  premium-ui-visual-diff:
    needs: premium-ui-browser-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: premium-ui-browser-evidence, path: InovaGed.UiTests }
      - name: Validate visual comparison
        run: python3 scripts/ci/assert-ui-tests-executed.py

  premium-ui-responsive:
    needs: premium-ui-browser-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: premium-ui-browser-evidence, path: InovaGed.UiTests }
      - name: Validate responsive matrix
        run: python3 scripts/ci/assert-ui-tests-executed.py

  premium-ui-accessibility:
    needs: premium-ui-browser-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: premium-ui-browser-evidence, path: InovaGed.UiTests }
      - name: Validate accessibility browser run
        run: python3 scripts/ci/assert-ui-tests-executed.py

  premium-ui-interactions:
    needs: premium-ui-browser-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: premium-ui-browser-evidence, path: InovaGed.UiTests }
      - name: Validate keyboard and interaction run
        run: python3 scripts/ci/assert-ui-tests-executed.py

  premium-ui-performance:
    needs: premium-ui-browser-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: premium-ui-browser-evidence, path: InovaGed.UiTests }
      - name: Validate performance evidence
        run: python3 scripts/ci/assert-ui-tests-executed.py

  premium-ui-artifacts:
    needs: premium-ui-browser-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: premium-ui-browser-evidence, path: InovaGed.UiTests }
      - name: Validate published UI artifacts
        run: python3 scripts/ci/assert-ui-tests-executed.py

  premium-ui-gate:
    if: always()
    needs: [premium-ui-build, premium-ui-browser-tests, premium-ui-visual-diff, premium-ui-responsive, premium-ui-accessibility, premium-ui-interactions, premium-ui-performance, premium-ui-artifacts]
    runs-on: ubuntu-latest
    steps:
      - env: { NEEDS_CONTEXT: '${{ toJson(needs) }}' }
        run: python -c 'import json,os,sys; r=json.loads(os.environ["NEEDS_CONTEXT"]); print(r); sys.exit(any(v["result"]!="success" for v in r.values()))'

  engineering-gate:
    if: always()
    needs:
      - actionlint
      - toolchain-validation
      - linux-build-validation
      - windows-build-validation
      - solution-validation
      - razor-view-compilation
      - migration-manifest-validation
      - server-linux
      - agent-windows
      - security-guards
      - migration-idempotency
      - cms-contract-tests
      - poc-matrix-contract-tests
      - continuity-integration
      - identity-auth-integration
      - deployment-gate
      - observability-gate
      - premium-ui-gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Require every mandatory gate to pass
        env:
          NEEDS_CONTEXT: ${{ toJson(needs) }}
        run: |
          python - <<'PY'
          import json, os, sys
          results = {name: job["result"] for name, job in json.loads(os.environ["NEEDS_CONTEXT"]).items()}
          failed = {name: result for name, result in results.items() if result != "success"}
          print(json.dumps(results, indent=2, sort_keys=True))
          sys.exit(1 if failed else 0)
          PY
