name: InovaGED Quality Gate
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main, develop]

permissions:
  contents: read

jobs:

  quality-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '8.0.x' }
      - run: dotnet restore InovaGed.sln
      - run: dotnet build InovaGed.sln -v:minimal
      - run: dotnet run --project InovaGed.Environment.Doctor --no-build -- quality-gate --no-db-required
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: quality-gate-report, path: artifacts/quality-gate/ }
